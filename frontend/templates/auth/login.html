{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700">
                EduCore
            </h1>

            <p class="text-gray-500 mt-2">
                Sistema de Gestão Acadêmica
            </p>
        </header>

        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- E-mail -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    E-mail
                </label>

                <input type="email" id="email" name="email" required placeholder="seu@email.com" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Senha -->
            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">
                    Senha
                </label>

                <div class="flex items-center border border-gray-300 rounded-lg focus-within:ring-2 focus-within:ring-blue-500">
                    <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" class="flex-1 min-w-0 px-4 py-3 border-0 outline-none focus:ring-0 focus:outline-none rounded-lg">

                    <button type="button" onclick="alternarSenha('senha', this)" class="px-3 text-gray-500 hover:text-gray-700" aria-label="Mostrar senha">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>
            </div>

            {% include "_mensagens.html" %}

            <!-- Entrar -->
            <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
                Entrar
            </button>
        </form>

        <footer class="text-center text-gray-400 text-sm mt-8">
            EduCore © 2026
        </footer>

    </div>
</div>

<script>
    function alternarSenha(id, botao) {
        const campo = document.getElementById(id);
        const icone = botao.querySelector("i");

        if (campo.type === "password") {
            campo.type = "text";
            icone.classList.replace("fa-eye", "fa-eye-slash");
            botao.setAttribute("aria-label", "Ocultar senha");
        } else {
            campo.type = "password";
            icone.classList.replace("fa-eye-slash", "fa-eye");
            botao.setAttribute("aria-label", "Mostrar senha");
        }
    }
</script>
{% endblock %}
