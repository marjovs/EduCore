<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduCore | Gestão Acadêmica</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Cabeçalho -->
<header class="bg-purple-700 text-white shadow-md">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

<a href="{{ url_for('auth.dashboard') }}"
class="text-2xl font-bold tracking-wide">
EduCore
</a>

{% if session.get('usuario') %}

<div class="flex items-center gap-4">

<span class="text-sm hidden md:block">
{{ session.get('usuario') }}
</span>

<a href="{{ url_for('auth.logout') }}"
class="bg-purple-900 hover:bg-purple-950 px-4 py-2 rounded-lg text-sm">
Sair
</a>

</div>

{% endif %}

</div>

</header>

<!-- Conteúdo principal -->
<main>
{% block content %}
{% endblock %}
</main>

<!-- Rodapé -->
<footer class="text-center text-gray-500 text-sm py-6">
EduCore © 2026 | Sistema de Gestão Acadêmica
</footer>

</body>

</html>
