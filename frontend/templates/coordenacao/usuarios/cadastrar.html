{% extends "base.html" %}

{% block titulo %}Novo usuário{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            Novo usuário
        </h1>

        {% include "_mensagens.html" %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="email" class="block font-medium mb-1">
                    E-mail *
                </label>

                <input type="email" id="email" name="email" required maxlength="120" value="{{ email }}"
                    autocomplete="off" class="w-full border border-gray-300 rounded-lg p-3">
            </div>

            <div>
                <label for="perfil" class="block font-medium mb-1">
                    Perfil *
                </label>

                <select id="perfil" name="perfil" required class="w-full border border-gray-300 rounded-lg p-3">
                    <option value="">Selecione</option>
                    {% for opcao in perfis %}
                    <option value="{{ opcao }}" {{ 'selected' if perfil == opcao }}>{{ nomes_perfis[opcao] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="senha" class="block font-medium mb-1">
                    Senha inicial *
                </label>

                <input type="password" id="senha" name="senha" required minlength="8" maxlength="128" autocomplete="new-password"
                    class="w-full border border-gray-300 rounded-lg p-3">

                <p class="text-sm text-gray-500 mt-1">
                    Pelo menos 8 caracteres. A pessoa pode trocá-la depois em "Minha senha".
                </p>
            </div>

            <div>
                <label for="confirmacao" class="block font-medium mb-1">
                    Confirmar senha *
                </label>

                <input type="password" id="confirmacao" name="confirmacao" required minlength="8" maxlength="128" autocomplete="new-password"
                    class="w-full border border-gray-300 rounded-lg p-3">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700">
                    Cadastrar usuário
                </button>

                <a href="{{ url_for('usuarios.listar') }}" class="bg-gray-200 px-6 py-3 rounded-lg hover:bg-gray-300">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
