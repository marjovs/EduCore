<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            EduCore | Cadastrar Aluno
        </title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-slate-100 min-h-screen p-6">
        <main class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow">
            <a href="{{ url_for('alunos.listar') }}" class="text-blue-700 hover:underlinebg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg">
                Voltar para alunos
            </a>

            <h1 class="text-2xl font-bold text-gray-800 mt-5 mb-6">
                Cadastrar aluno
            </h1>

            {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
            {% for mensagem in mensagens %}
            <p class="text-red-600 mb-4">
                {{ mensagem }}
            </p>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label class="block mb-1 font-medium">
                        Nome completo *
                    </label>
                    
                    <input type="text" name="nome" required class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block mb-1 font-medium">
                        E-mail *
                    </label>
                    
                    <input type="email" name="email" required class="w-full border rounded-lg p-3"> 
                </div>

                <div>
                    <label class="block mb-1 font-medium">
                        CPF *
                    </label>

                    <input type="text" name="cpf" required maxlength="14" placeholder="000.000.000-00" class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block mb-1 font-medium">
                        Telefone
                    </label>
                    <input type="text" name="telefone" class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label class="block mb-1 font-medium">
                        Data de nascimento *
                    </label>

                    <input type="date" name="data_nascimento" required class="w-full border rounded-lg p-3">
                </div>

                <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg hover:bg-blue-800 font-semibold">
                    Salvar aluno
                </button>
            </form>
        </main>
    </body>
</html>
