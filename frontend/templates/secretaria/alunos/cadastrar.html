{% extends "base.html" %}

{% block titulo %}Cadastrar aluno{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow">
        <a href="{{ url_for('alunos.listar') }}" class="text-blue-700 hover:underlinebg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg">
            Voltar para alunos
        </a>

        <h1 class="text-2xl font-bold text-gray-800 mt-5 mb-6">
            Cadastrar aluno
        </h1>

        {% include "_mensagens.html" %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block mb-1 font-medium">
                    Nome completo *
                </label>

                <input type="text" name="nome" required maxlength="120" value="{{ valor_form('nome') }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    E-mail *
                </label>

                <input type="email" name="email" required maxlength="120" value="{{ valor_form('email') }}" class="w-full border rounded-lg p-3"> 
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    CPF *
                </label>

                <input type="text" name="cpf" required maxlength="14" placeholder="000.000.000-00" value="{{ valor_form('cpf') }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Telefone
                </label>
                <input type="text" name="telefone" maxlength="20" value="{{ valor_form('telefone') }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Data de nascimento *
                </label>

                <input type="date" name="data_nascimento" required value="{{ valor_form('data_nascimento') }}" class="w-full border rounded-lg p-3">
            </div>

            <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg hover:bg-blue-800 font-semibold">
                Salvar aluno
            </button>
        </form>
    </div>
</div>
{% endblock %}
