{% extends "base.html" %}

{% block titulo %}Editar curso{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow">
        <a href="{{ url_for('cursos.listar') }}" class="text-blue-700 hover:underlinebg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg">
            Voltar para cursos
        </a>

        <h1 class="text-2xl font-bold mt-5 mb-6">
            Editar curso
        </h1>

        {% include "_mensagens.html" %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block mb-1 font-medium">
                    Nome do curso *
                </label>

                <input type="text" name="nome" required maxlength="120" value="{{ valor_form('nome', curso.nome) }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Descrição
                </label>

                <textarea name="descricao" rows="3" class="w-full border rounded-lg p-3">{{ valor_form('descricao', curso.descricao or '') }}</textarea>
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Carga horária (horas) *
                </label>

                <input type="number" name="carga_horaria" min="1" max="20000" required value="{{ valor_form('carga_horaria', curso.carga_horaria) }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Modalidade *
                </label>

                <select name="modalidade" required class="w-full border rounded-lg p-3">
                    <option value="Presencial" {% if valor_form('modalidade', curso.modalidade) == 'Presencial' %}selected{% endif %}>
                        Presencial
                    </option>
                    <option value="EAD" {% if valor_form('modalidade', curso.modalidade) == 'EAD' %}selected{% endif %}>
                        EAD
                    </option>
                    <option value="Híbrido" {% if valor_form('modalidade', curso.modalidade) == 'Híbrido' %}selected{% endif %}>
                        Híbrido
                    </option>
                </select>
            </div>

            <div>
                <label class="block mb-1 font-medium">
                    Status
                </label>
                <select name="status" class="w-full border rounded-lg p-3">
                    <option value="Ativo" {% if valor_form('status', curso.status) == 'Ativo' %}selected{% endif %}>
                        Ativo
                    </option>
                    <option value="Inativo" {% if valor_form('status', curso.status) == 'Inativo' %}selected{% endif %}>
                        Inativo
                    </option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg hover:bg-blue-800">
                Salvar alterações
            </button>
        </form>
    </div>
</div>
{% endblock %}
