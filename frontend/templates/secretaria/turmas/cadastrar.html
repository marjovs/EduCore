{% extends "base.html" %}

{% block titulo %}Cadastrar turma{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-blue-700 mb-6">
            Cadastrar turma
        </h1>

        {% include "_mensagens.html" %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block font-medium mb-1">
                    Nome da turma 
                </label>

                <input type="text" name="nome" required maxlength="100" placeholder="Ex.: Turma A" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Curso
                </label>

                <select name="curso_id" required class="w-full border rounded-lg p-3">
                    <option value="">
                        Selecione um curso
                    </option>

                    {% for curso in cursos %}
                    <option value="{{ curso.id }}">
                        {{ curso.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Ano
                </label>

                <input type="number" name="ano" required min="2000" max="2100" placeholder="2026" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Turno
                </label>

                <select name="turno" required class="w-full border rounded-lg p-3">
                    <option value="">
                        Selecione o turno
                    </option>
                    <option value="Matutino">
                        Matutino
                    </option>
                    <option value="Vespertino">
                        Vespertino
                    </option>
                    <option value="Noturno">
                        Noturno
                    </option>
                </select>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Cadastrar
                </button>

                <a href="{{ url_for('turmas.listar') }}" class="bg-gray-200 px-6 py-3 rounded-lg hover:bg-gray-300">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
