{% extends "base.html" %}

{% block titulo %}Editar turma{% endblock %}

{% block content %}
<div class="p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-blue-700 mb-6">
            Editar turma
        </h1>

        {% include "_mensagens.html" %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block font-medium mb-1">
                    Nome da turma
                </label>

                <input type="text" name="nome" required maxlength="100" value="{{ valor_form('nome', turma.nome) }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Curso
                </label>

                <select name="curso_id" required class="w-full border rounded-lg p-3">
                    {% for curso in cursos %}
                    <option value="{{ curso.id }}" {% if valor_form('curso_id', turma.curso_id|string) == curso.id|string %}selected{% endif %}>
                        {{ curso.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Ano
                </label>

                <input type="number" name="ano" required min="2000" max="2100" value="{{ valor_form('ano', turma.ano) }}" class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Turno
                </label>

                <select name="turno" required class="w-full border rounded-lg p-3">
                    <option value="Matutino" {% if valor_form('turno', turma.turno) == "Matutino" %}selected{% endif %}>
                        Matutino
                    </option>

                    <option value="Vespertino" {% if valor_form('turno', turma.turno) == "Vespertino" %}selected{% endif %}>
                        Vespertino
                    </option>

                    <option value="Noturno" {% if valor_form('turno', turma.turno) == "Noturno" %}selected{% endif %}>
                        Noturno
                    </option>
                </select>
            </div>

            <div>
                <label class="block font-medium mb-1">
                    Status
                </label>

                <select name="status" required class="w-full border rounded-lg p-3">
                    <option value="Ativa" {% if valor_form('status', turma.status) == "Ativa" %}selected{% endif %}>
                        Ativa
                    </option>

                    <option value="Inativa" {% if valor_form('status', turma.status) == "Inativa" %}selected{% endif %}>
                        Inativa
                    </option>
                </select>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Salvar alterações
                </button>

                <a href="{{ url_for('turmas.listar') }}" class="bg-gray-200 px-6 py-3 rounded-lg hover:bg-gray-300">
                    Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
